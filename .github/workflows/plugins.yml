name: Plugin validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Validate release metadata
        run: python3 scripts/check-release.py
      - name: Generate manifests and check for drift
        run: python3 scripts/generate.py && git diff --exit-code
      - name: Validate JSON and plugin contracts
        run: scripts/check-plugins.sh
      - name: Run plugin drift regression tests
        run: tests/check_plugins_test.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20.0.0
        with:
          globs: "**/*.md"
      - name: Validate with Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code
          for plugin in plugins/*; do claude plugin validate --strict "$plugin"; done
          claude plugin validate --strict .
      - name: Check out Cursor plugin schemas
        uses: actions/checkout@v5.1.0
        with:
          repository: cursor/plugins
          path: .upstream/cursor-plugins
          sparse-checkout: schemas
      - name: Validate Cursor manifests and server.json against upstream schemas
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/ajv" ajv-cli@5 ajv-formats@3
          ajv() {
            "$RUNNER_TEMP/ajv/node_modules/.bin/ajv" validate --spec=draft7 --strict=false \
              -c "$RUNNER_TEMP/ajv/node_modules/ajv-formats" "$@"
          }
          schemas=.upstream/cursor-plugins/schemas
          ajv -s "$schemas/marketplace.schema.json" -d .cursor-plugin/marketplace.json
          for plugin in plugins/*; do ajv -s "$schemas/plugin.schema.json" -d "$plugin/.cursor-plugin/plugin.json"; done
          schema_url="$(python3 -c 'import json; print(json.load(open("server.json"))["$schema"])')"
          curl -fsSL "$schema_url" -o "$RUNNER_TEMP/server.schema.json"
          ajv -s "$RUNNER_TEMP/server.schema.json" -d server.json
          rm -rf .upstream
      - name: Validate with Gemini CLI
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/gemini" @google/gemini-cli@0.62.0
          "$RUNNER_TEMP/gemini/node_modules/.bin/gemini" extensions validate "$PWD"
      - name: Validate with Codex
        run: |
          npm install --global @openai/codex
          plugin_home="$(mktemp -d)"
          CODEX_HOME="$plugin_home" codex plugin marketplace add ./
          CODEX_HOME="$plugin_home" codex plugin add compose-catalogs@compose-agent-plugins
          CODEX_HOME="$plugin_home" codex plugin add compose-preview@compose-agent-plugins
          # Cross-repository entry: the canonical skills bundle from yschimke/skills.
          CODEX_HOME="$plugin_home" codex plugin add compose-skills@compose-agent-plugins
          CODEX_HOME="$plugin_home" codex plugin list
      - name: Validate with Antigravity when available
        run: |
          if command -v agy >/dev/null 2>&1; then
            for plugin in plugins/*; do agy plugin validate "$plugin"; done
          else
            echo "::notice::agy is unavailable; static Antigravity validation ran above"
          fi
